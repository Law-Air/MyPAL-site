name: Test SMTP Mail (Prod)

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Adresa de test unde se trimite emailul'
        required: true
        default: 'office@my-pal.ai'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Send test email
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/mypal-backend && set -a && source /etc/mypal/db.env && set +a && node dist/scripts/testMail.js '${{ inputs.to }}'"
