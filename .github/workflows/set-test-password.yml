name: Set Test Password (Prod, fictive data)

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'Email-ul site-ului de test'
        required: true
      password:
        description: 'Parola noua de setat'
        required: true

jobs:
  set:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
      - name: Set password
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            "cd /opt/mypal-backend && set -a && source /etc/mypal/db.env && set +a && node dist/scripts/setTestPassword.js '${{ inputs.email }}' '${{ inputs.password }}'"
